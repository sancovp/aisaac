<!-- ══════════════════════════════════════════════════════════════════════
     B0 — THE HEAD/META CONTRACT. (rebuild spec §2.3)
     Non-negotiable on every page, including every blog post.

     SITE_ORIGIN = https://sancovp.github.io/aisaac
       Confirmed 2026-08-07 against the live deploy (200 on /aisaac/ and
       /aisaac/system.html; 404 on sancovp.github.io/style.css).
       It is a GitHub Pages PROJECT SUBPATH.

     Consequence — THE PATH LAW:
       · in-page href/src  → RELATIVE   ("style.css", "../style.css")
       · canonical + og/twitter URLs → ABSOLUTE, prefixed with SITE_ORIGIN
       Root-absolute paths ("/style.css") are FORBIDDEN sitewide: they
       resolve above the project subpath and 404.

     Placeholders to fill: {TITLE} ≤60 chars · {DESC} ≤155 chars ·
     {PATH} the page path after SITE_ORIGIN · {PAGE} og image basename ·
     {UP} "" at root, "../" one level down.
     ══════════════════════════════════════════════════════════════════════ -->
