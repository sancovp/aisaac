<!-- ══════════════════════════════════════════════════════════════════════
     B1 — THE NAV. THE SINGLE SOURCE. (rebuild spec §2.2)

     The nav IS the ladder. Six items. Identical on EVERY page.
     Builders B and C PASTE this verbatim. Nobody edits nav markup inside
     their own page — if the nav must change, Builder A changes it here and
     B/C re-paste.

     PATH LAW: the site deploys to https://sancovp.github.io/aisaac/ — a
     PROJECT SUBPATH, not a domain root. Root-absolute hrefs ("/watch.html")
     resolve to sancovp.github.io/watch.html and 404. Two variants below:
     use ROOT for pages at the repo root, DEPTH-1 for pages one directory
     down (worlds/, notes/, blog/, inside/, ssri/).

     The <button> requires nav.js only to COLLAPSE the menu on mobile.
     With JS off the button stays hidden and the links stay visible.
     ══════════════════════════════════════════════════════════════════════ -->
