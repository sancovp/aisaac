<!-- ══════════════════════════════════════════════════════════════════════
     B1 — THE NAV. THE SINGLE SOURCE. (rebuild spec §2.2)

     The nav IS the ladder. Six items + the brand slot. Identical on EVERY
     page that carries a nav — index.html carries NONE (see below).

     THE RATCHET LAW (Isaac, 2026-08-07): "fundamentally a funnel is a series
     of ratcheted options such that the avatar can't figure out how to do
     anything except sanctioned moves." Consequences, baked into this file:
       · The brand slot (top-left "Isaac") routes to isaac.html — the hub you
         return to — NEVER to index.html.
       · index.html is the ENTRYPOINT ONLY, one-way: no nav element anywhere
         on the site routes back to it (browser-back only), and index itself
         is CHROMELESS — it ships no nav bar; its exits live in its bands.
     Builders B and C PASTE this verbatim. Nobody edits nav markup inside
     their own page — if the nav must change, Builder A changes it here and
     B/C re-paste.

     PATH LAW: the site deploys to https://sancovp.github.io/aisaac/ — a
     PROJECT SUBPATH, not a domain root. Root-absolute hrefs ("/watch.html")
     resolve to sancovp.github.io/watch.html and 404. Two variants below:
     use ROOT for pages at the repo root, DEPTH-1 for pages one directory
     down (worlds/, notes/, blog/, inside/, ssri/).

     The <button> requires nav.js only to COLLAPSE the menu on mobile.
     With JS off the button stays hidden and the links stay visible.
     ══════════════════════════════════════════════════════════════════════ -->
