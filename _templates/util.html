<!-- ══════════════════════════════════════════════════════════════════════
     TYPE 5 — UTILITY.  Owner: Builder C.  Three sub-uses, no others.

     1. REDIRECT — must be a HOST-LEVEL 301 wherever possible.
        A meta-refresh is permitted ONLY at content="0" AND must carry a
        real, visible link. A timed refresh (content="4") is a WCAG 2.2.1
        failure and dies. Pattern:
          <meta http-equiv="refresh" content="0; url=notes/">
          <p>This page moved. <a href="notes/">Go to the notes &rarr;</a></p>

     2. 404.html — new; the site has none today.

     3. inside/* — canon / lore pages. ALWAYS <meta name="robots"
        content="noindex">. No sticky-cta, no exit-popup, no email capture.
        Reachable ONLY from system.html's footer and from each other.
        Lore is the inside, never the door.
     ══════════════════════════════════════════════════════════════════════ -->
